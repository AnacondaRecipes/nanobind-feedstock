{% set name = "nanobind" %}
{% set version = "2.13.0" %}
# See: https://github.com/wjakob/nanobind/blob/master/src/nb_abi.h
{% set abi_version = 20 %}
# See: https://github.com/wjakob/nanobind/tree/master/ext
{% set robin_map_commit = "4ec1bf19c6a96125ea22062f38c2cf5b958e448e" %}

package:
  name: {{ name|lower }}-split
  version: {{ version }}

source:
  - url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
    sha256: c7b04d6a6a4cd57985571e605539399b51331ae455d7fce576a5e2fcb89b1dcf
  - url: https://github.com/Tessil/robin-map/archive/{{ robin_map_commit }}.tar.gz
    sha256: 4968947bd2e908854481519ec422823af4161a286ff1e16943293b753e80cb3f
    folder: ext/robin_map

build:
  number: 0

outputs:
  - name: nanobind-abi
    version: {{ abi_version }}
    build:
      run_exports:
        - nanobind-abi =={{ abi_version }}
    test:
      source_files:
        - src/nb_abi.h
      commands:
        # make sure the internals version matches the package version
        - if [[ $(grep "define NB_INTERNALS_VERSION" src/nb_abi.h | grep -E -o '[0-9]+') != "{{ abi_version }}" ]]; then exit 1; fi  # [not win]
        - powershell -Command "if ((Select-String -Path src\nb_abi.h -Pattern 'define NB_INTERNALS_VERSION').Line -match '(\d+)' -and $matches[1] -ne '{{abi_version}}') { exit 1 }"  # [win]
  - name: nanobind
    script: build_nanobind.sh  # [not win]
    script: bld_nanobind.bat  # [win]
    requirements:
      host:
        - pip
        - python
        - setuptools
        - wheel
        - cmake
        - make  # [not win]
        - scikit-build-core >=0.10
      run:
        - python
      run_constrained:
        - nanobind-abi =={{ abi_version }}
    # The pytests are disabled. _ext files missed. Example:
    # test_chrono_ext -> https://github.com/wjakob/nanobind/blob/v2.5.0/tests/test_chrono.py#L3
    test:
      imports:
        - nanobind
      commands:
        - pip check
        - python -c "import nanobind; import os; assert os.path.isdir(nanobind.cmake_dir()) and os.path.isdir(nanobind.include_dir())"
      requires:
        - pip
        - pytest

about:
  home: https://github.com/wjakob/nanobind
  summary: Seamless operability between C++17 and Python
  description: |
    nanobind is a small binding library that exposes C++ types in Python and
    vice versa. It is reminiscent of Boost.Python and pybind11 and uses
    near-identical syntax. In contrast to these existing tools, nanobind is
    more efficient: bindings compile in a shorter amount of time, producing
    smaller binaries with better runtime performance.
  license: BSD-3-Clause and MIT
  license_family: Other
  license_file:
    # nanobind license is BSD-3-Clause
    - LICENSE
    # robin_map license is MIT
    - ext/robin_map/LICENSE
  doc_url: https://github.com/wjakob/nanobind/tree/master/docs
  dev_url: https://github.com/wjakob/nanobind

extra:
  recipe-maintainers:
    - snegireff
